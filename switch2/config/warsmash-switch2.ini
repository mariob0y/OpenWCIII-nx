// Warsmash on the Switch 2 (warsmash-nx): goes to sdmc:/switch/warsmash/warsmash.ini.
// The same data as the PC (config/warsmash-pc131.ini), copied to the card:
//   C:\VSCode_projects\warsmash\wc3data\war3.w3mod     -> sdmc:/switch/warsmash/wc3data/war3.w3mod
//   OpenWCIII-nx\resources -> sdmc:/switch/warsmash/resources
//   OpenWCIII-nx\core\assets -> sdmc:/switch/warsmash/assets
// Path04 is the PC's "." (core/assets). Never point a source at sdmc:/switch/warsmash itself:
// the file list is built by walking every folder, and that would walk the whole 3.1 GB tree again.
// Everything Warsmash reads or writes stays under sdmc:/switch/warsmash/ (the guard's jail).
[DataSources]
Count=5
Type00=Folder
Path00="sdmc:/switch/warsmash/wc3data/war3.w3mod"
Type01=Folder
Path01="sdmc:/switch/warsmash/wc3data/war3.w3mod/_locales/enus.w3mod"
Type02=Folder
Path02="sdmc:/switch/warsmash/resources"
Type03=Folder
Path03="sdmc:/switch/warsmash/wc3data/war3.w3mod/maps"
Type04=Folder
Path04="sdmc:/switch/warsmash/assets"

[Map]
FilePath="frozenthrone\(2)echoisles.w3x"

// No network on the console build.
[GamingNetwork]
Server=127.0.0.1

[Emulator]
// 1.29 and later are the "24 player" patches.
MaxPlayers=28
GameVersion=1
CatchCursor=1
FixFlatFilesTilesetLoading=0
EnableMusic=1
LoadUnitsFromWorldEditData=0
CrashOnIncompatible132Features=0
InputHotkeyMode=1
ParseReignOfChaosBetaModelsInstead=0
// warsmash-nx: worker threads for model poses (WorldScene + ParallelJobs). Absent = one per core
// the game thread and the GL driver leave free; 0 = everything on the game thread (as before).
// Workers=1
